function teamMatches(t,q){if(!q.trim())return true;const m=t.metadata||{};const src=[t.name,m.summary||'',...(m.tags||[]),...(m.useCases||[]),...(m.quickPrompts||[]),m.notes||'',t.series];const joined=src.join(' ').toLocaleLowerCase();return q.trim().toLocaleLowerCase().split(/\s+/).every(k=>joined.includes(k))}

function fitCategoryStrips(){document.querySelectorAll('[data-category-strip]').forEach(strip=>{const buttons=[...strip.querySelectorAll('button')];if(!buttons.length)return;buttons.forEach(b=>b.hidden=false);const gap=parseFloat(getComputedStyle(strip).columnGap)||5,max=strip.clientWidth;let used=0,overflowed=false;for(const b of buttons){const w=b.getBoundingClientRect().width;if(b.classList.contains('category-extra')&&(overflowed||used+(used?gap:0)+w>max)){b.hidden=true;overflowed=true;continue}used+=(used?gap:0)+w}})}
window.addEventListener('resize',fitCategoryStrips);
function render(){document.getElementById('app').innerHTML=`<div class="demo-bar"><span class="demo-flag"><span class="dot"></span> 交互原型 · 按 v0.1.5 原生视图增量设计（未接入宿主）</span><div class="switch"><button class="${state.mode==='settings'?'active':''}" data-action="mode" data-value="settings">设置弹窗</button><button class="${state.mode==='chat'?'active':''}" data-action="mode" data-value="chat">对话框选择器</button></div></div>${state.mode==='settings'?settingsMarkup():chatMarkup()}`;renderModal();requestAnimationFrame(fitCategoryStrips)}
function settingsMarkup(){return `<section class="settings-window"><header class="settings-header"><h1>设置</h1><div class="head-actions"><button class="btn" data-action="config">打开配置文件</button><button class="icon-button" aria-label="关闭演示设置" data-action="mode" data-value="chat">×</button></div></header><div class="settings-body"><nav class="host-nav">${[['⚙','通用设置'],['▤','模型'],['☷','内置插件'],['♧','Agent 预设'],['⚙','智能体团队预设']].map((it,i)=>`<button class="nav-button ${i===4?'active':''}" data-action="host-nav" title="${esc(it[1])}"><span class="nav-glyph">${it[0]}</span><span class="nav-text">${it[1]}</span></button>`).join('')}</nav><main class="settings-main"><div class="main-scroll"><div class="main-width">${mainMarkup()}</div></div><footer class="footer"><span class="footer-note">${state.dirty?'存在尚未保存的修改（仅演示）':'Web 开发视图 · Desktop 生产兼容性需独立验收'}</span><div class="footer-right"><button class="btn text" data-action="discard">放弃修改</button><button class="btn primary" data-action="save">保存</button></div></footer></main></div></section>`}
function mainMarkup(){switch(state.page){case 'list':return teamListMarkup();case 'team':return teamEditorMarkup();case 'member':return memberMarkup();case 'skills':return skillLibraryMarkup();case 'skill':return skillDetailMarkup();default:return teamListMarkup()}}
function teamListMarkup(){const matches=filterTeams(state.source,state.groupFilter,state.query);const groups=[['all','全部分类'],['series:研发规模','插件内置 · 研发规模'],['series:工作模式','插件内置 · 工作模式'],...state.groups.map(g=>[g.id,g.name])];const quickGroups=[['series:研发规模','研发规模'],['series:工作模式','工作模式'],...state.groups.map(g=>[g.id,g.name])];return `<h2 class="page-title">智能体团队预设</h2><p class="page-sub">可复用的命名智能体团队。选择队员的模型、提示词和工具权限，在对话框中为会话选择团队。</p><div class="title-actions"><button class="btn" data-action="new-team">新建团队</button><button class="btn" data-action="go-skills">团队技能配置</button><button class="btn" data-action="manage-groups">管理分类</button><button class="btn" data-action="restore">恢复默认团队</button></div><div class="toolbar"><input class="search" data-input="team-search" placeholder="搜索名称、简介、标签、适用场景、推荐任务" value="${esc(state.query)}"><select class="select" data-change="team-group">${groups.map(([id,n])=>`<option value="${esc(id)}" ${state.groupFilter===id?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="segment category-strip" data-category-strip="settings"><button class="${state.source==='all'&&state.groupFilter==='all'?'active':''}" data-action="source" data-value="all">全部</button><button class="${state.source==='builtin'?'active':''}" data-action="source" data-value="builtin">插件内置</button><button class="${state.source==='custom'?'active':''}" data-action="source" data-value="custom">自定义</button>${quickGroups.map(([key,label])=>`<button class="category-extra ${state.groupFilter===key?'active':''}" data-action="category" data-value="${esc(key)}" title="${esc(label)}">${esc(label)}</button>`).join('')}</div><p class="category-select-hint">创建的分类将自动出现在这里；显示不下时隐藏，仍可通过上方「分类」下拉框访问。</p><p class="filter-hint">匹配 ${matches.length} 个团队 · 展示信息不会注入运行时上下文</p><div class="rowlist">${matches.length?matches.map(t=>`<div class="list-row"><span class="avatar-dot ${t.origin==='custom'?'dot-purple':''}"></span><button class="list-main" style="text-align:left;background:none;border:0;padding:0;cursor:pointer" data-action="open-team" data-id="${t.id}"><div class="list-title">${esc(t.name)} ${t.origin==='builtin'?'<span class="tag origin">内置</span>':'<span class="tag">自定义</span>'} ${t.modified?'<span class="tag warn">已修改</span>':''}</div><div class="list-sub">${esc(t.metadata?.summary||t.purpose)} · ${t.members.length} 名队员</div></button><div class="list-actions"><button class="mini-link" data-action="duplicate" data-id="${t.id}">复制</button><button class="mini-link" data-action="export" data-id="${t.id}">导出</button><button class="mini-link" data-action="delete-team" data-id="${t.id}">删除</button><button class="mini-link" data-action="open-team" data-id="${t.id}">›</button></div></div>`).join(''):`<div class="empty" style="border:0">没有匹配的团队。尝试清除搜索词或筛选条件。</div>`}</div><div class="toolbar"><button class="btn" data-action="import-preset">导入团队预设 JSON</button></div><p class="muted">插件内置共 9 个（研发规模 3 + 工作模式 6）；用户创建的 Team Skill 及其本地成员分配不随预设导出。</p>`}
function teamEditorMarkup(){const t=findTeam();if(!t)return '';return `<button class="crumb" data-action="page" data-value="list">‹ 全部团队</button><h2 class="page-title">${esc(t.name)}</h2><div class="panel"><label class="field-label">团队名称 <span class="tag warn">运行时相关</span></label><input class="field" data-team-field="name" value="${esc(t.name)}"><label class="field-label">团队用途说明</label><textarea class="field textarea" data-team-field="purpose">${esc(t.purpose)}</textarea><div class="info runtime-hint"><span class="i">ⓘ</span><div><b>团队基本配置可能参与运行时上下文。</b>团队名称用于预设识别，用途说明可能参与队长运行时说明；下面的「团队展示信息」仅面向用户查看和搜索，不会自动注入 Prompt。</div></div></div><div class="panel"><div class="space-between"><div class="panel-title">团队展示信息 <span class="tag ok">仅用于展示</span></div><button class="btn small" data-action="toggle-metadata">${state.metadataFold?'展开':'折叠'}</button></div><div class="info"><span class="i">ⓘ</span><div><b>这部分不会注入队长或成员的运行时上下文。</b><br>仅用于搜索、分类、团队介绍及预设导入导出；内容长度不增加自动注入的 Token。主动复制推荐任务到聊天中除外。</div></div>${state.metadataFold?'':metadataInputs(t)}</div><div class="sep-title">这个团队包含什么</div><div class="panel"><button class="edit-row" style="width:100%;background:none;border:0;text-align:left;cursor:pointer" data-action="open-member" data-id="captain"><span class="avatar-dot"></span><span class="list-main"><div>队长 · lead</div><div class="list-sub">会话模型 · ${esc(t.captain.description)}</div></span><span class="chev">›</span></button><p class="muted">队长接管会话；成员按需召唤，均使用各自配置的模型、工具和专属 Team Skill。</p></div><div class="panel"><div class="space-between"><div class="panel-title">队员</div><button class="btn small" data-action="add-member">添加队员</button></div>${t.members.map(m=>`<div class="edit-row"><span class="avatar-dot dot-green"></span><button data-action="open-member" data-id="${esc(m.id)}" style="border:0;background:none;padding:0;text-align:left;cursor:pointer" class="list-main"><div>${esc(m.name)}</div><div class="list-sub">${esc(m.provider)} · ${esc(m.model)} · ${m.skills.length} 个 Team Skill</div></button><button class="mini-link" data-action="remove-member" data-id="${esc(m.id)}">删除队员</button><span class="chev">›</span></div>`).join('')}</div><label class="field-label">我的分类（本地视图，不影响运行时）</label><select class="field" data-change="assign-category"><option value="">未分类</option>${state.groups.map(g=>`<option value="${esc(g.id)}" ${g.id===t.group?'selected':''}>${esc(g.name)}</option>`).join('')}</select><div class="toolbar"><button class="btn" data-action="export" data-id="${t.id}">导出团队 JSON</button><button class="btn" data-action="go-skills">打开团队技能库</button></div>`}
function metadataInputs(t){const m=t.metadata||{};return `<label class="field-label">团队简介（summary）</label><textarea class="field textarea" data-meta-field="summary">${esc(m.summary)}</textarea><label class="field-label">标签（使用英文逗号 , 分隔）</label><input class="field" data-meta-field="tags" placeholder="例如：frontend, refactor, review" value="${esc((m.tags||[]).join(', '))}"><p class="muted" style="margin:5px 0 8px">多个标签请用英文半角逗号分隔，例如：development, testing, security</p><label class="field-label">适用场景（每行一项）</label><textarea class="field textarea" data-meta-field="useCases">${esc((m.useCases||[]).join('\n'))}</textarea><label class="field-label">推荐任务（每行一项）</label><textarea class="field textarea" data-meta-field="quickPrompts">${esc((m.quickPrompts||[]).join('\n'))}</textarea><label class="field-label">备注</label><textarea class="field textarea" data-meta-field="notes">${esc(m.notes||'')}</textarea>`}
function memberMarkup(){const t=findTeam(),m=slot();if(!m)return '';const captain=state.activeMember==='captain';return `<button class="crumb" data-action="page" data-value="team">‹ ${esc(t.name)}</button><h2 class="page-title">${captain?'队长':'队员'} · ${esc(m.name)}</h2><div class="panel"><div class="panel-title">基本信息</div><label class="field-label">名称</label><input class="field" data-member-field="name" value="${esc(m.name)}"><label class="field-label">颜色标记</label><div class="color-options">${['#fff','#4b84ff','#2abd76','#d8a13c','#dd5666','#9273eb','#2ca6be','#8992a2'].map((c,i)=>`<button style="background:${c}" class="${(m.color||'#4b84ff')===c?'on':''}" data-action="color" data-value="${c}" aria-label="颜色 ${i}"></button>`).join('')}</div><label class="field-label">描述（可能参与运行时角色说明）</label><textarea class="field textarea" data-member-field="description">${esc(m.description)}</textarea></div>${captain?'<div class="panel"><div class="panel-title">模型</div><p class="muted">队长使用当前会话已选择的模型。</p></div>':`<div class="panel"><div class="panel-title">模型</div><label class="field-label">提供商</label><select class="field" data-member-field="provider">${['未指定','示例提供商 A','示例提供商 B'].map(v=>`<option ${m.provider===v?'selected':''}>${v}</option>`).join('')}</select><label class="field-label">模型</label><select class="field" data-member-field="model">${['按环境选择','跟随配置','示例旗舰模型','示例快速模型'].map(v=>`<option ${m.model===v?'selected':''}>${v}</option>`).join('')}</select><label class="field-label">思考强度</label><select class="field" data-member-field="effort">${['模型默认','低','中','高'].map(v=>`<option ${m.effort===v?'selected':''}>${v}</option>`).join('')}</select></div>`}<div class="panel"><div class="panel-title">工具</div><label class="field-label">工具权限</label><select class="field" data-member-field="tool"><option value="all" ${m.tool==='all'?'selected':''}>默认所有工具</option><option value="custom" ${m.tool==='custom'?'selected':''}>自定义允许的工具</option></select><p class="muted">沿用现有工具权限机制；Team Skill 不会扩大 Shell、MCP 或其他工具执行权限。</p></div><div class="panel"><div class="space-between"><div class="panel-title">团队专属 Skills</div><button class="btn small" data-action="go-skills">管理 Team Skills</button></div><p class="muted">参照工具权限的九宫格交互：每个方格独立勾选，只影响当前成员。此处仅管理插件私有的 Team Skills。</p><div class="member-skill-grid">${skills.map(s=>`<label class="member-skill-card" title="${esc(s.name)} · ${esc(s.desc)}"><span class="skill-card-top"><span class="skill-card-icon">▣</span><input type="checkbox" aria-label="为 ${esc(m.name)} 分配 ${esc(s.name)}" data-skill-toggle="${esc(s.id)}" ${m.skills.includes(s.id)?'checked':''}></span><span class="skill-card-name">${esc(s.name)}</span><span class="skill-card-desc">${esc(s.desc)}</span><span class="tag ${s.origin==='builtin'?'origin':''}">${s.origin==='builtin'?'内置':'自定义'}</span></label>`).join('')}</div><div class="info"><span>ⓘ</span><span>仅该成员的运行实例按 Scope 发现已分配技能；完整正文按需加载。宿主原有用户级 / 项目级 Skill 继续按 DSH 原生继承规则运行。</span></div></div><div class="panel"><div class="panel-title">System Prompt <span class="tag warn">运行时配置</span></div><textarea class="field textarea huge" data-member-field="prompt">${esc(m.prompt)}</textarea></div>`}
function skillLibraryMarkup(){const items=skills.filter(s=>(state.skillSource==='all'||s.origin===state.skillSource)&&(`${s.name} ${s.desc}`.toLowerCase().includes(state.skillQuery.toLowerCase())));return `<button class="crumb" data-action="page" data-value="list">‹ 智能体团队预设</button><h2 class="page-title">团队技能配置</h2><p class="page-sub">独立管理插件 Team Skills 库。完整保留 SKILL.md、scripts、references 和 assets；成员绑定在各自编辑页配置。</p><div class="info"><span>ⓘ</span><span>Team Skills 位于插件私有目录，默认不注册为用户级或项目级 Skill。只有获分配的团队成员才能通过插件作用域发现。普通 DSH 全局 Skills 不在这里管理。</span></div><div class="title-actions"><button class="btn" data-action="new-skill">新建 Skill</button><button class="btn" data-action="import-skill">导入完整文件夹</button><button class="btn" data-action="open-folder">打开 Team Skills 文件夹</button></div><div class="toolbar"><input class="search" placeholder="搜索团队技能名称或简介" data-input="skill-search" value="${esc(state.skillQuery)}"></div><div class="segment" style="margin-bottom:10px"><button data-action="skill-source" data-value="all" class="${state.skillSource==='all'?'active':''}">全部</button><button data-action="skill-source" data-value="builtin" class="${state.skillSource==='builtin'?'active':''}">插件内置</button><button data-action="skill-source" data-value="custom" class="${state.skillSource==='custom'?'active':''}">自定义</button></div><div class="rowlist">${items.map(s=>`<button class="list-row" data-action="open-skill" data-id="${s.id}"><span class="avatar-dot ${s.origin==='builtin'?'dot-blue':'dot-purple'}"></span><span class="list-main"><span class="list-title">${esc(s.name)} <span class="tag ${s.origin==='builtin'?'origin':''}">${s.origin==='builtin'?'内置':'自定义'}</span></span><span class="list-sub">${esc(s.desc)} · ${Object.keys(s.files).length} 个文件 · 绑定 ${bindings(s.id).length} 位成员</span></span><span class="chev">›</span></button>`).join('')||'<div class="empty">没有匹配的技能</div>'}</div><p class="muted" style="margin-top:13px">内置 Skill 随插件版本更新，修改时创建本地覆盖副本。已绑定或正被运行实例使用的自定义 Skill 不允许直接删除。</p>`}
function bindings(id){return state.teams.flatMap(t=>[t.captain,...t.members].filter(m=>m.skills.includes(id)).map(m=>({team:t.name,teamId:t.id,member:m.name,memberId:m.id})));}
function skillDetailMarkup(){const s=findSkill();if(!s)return '';const files=Object.keys(s.files);if(!files.includes(state.file))state.file='SKILL.md';const bs=bindings(s.id);return `<button class="crumb" data-action="page" data-value="skills">‹ 团队技能配置</button><h2 class="page-title">${esc(s.name)}</h2><p class="page-sub">${esc(s.desc)}</p><div class="pill-list"><span class="tag ${s.origin==='builtin'?'origin':''}">${s.origin==='builtin'?'内置 · 受保护':'自定义 · 可编辑'}</span><span class="tag">版本 ${esc(s.version)}</span><span class="tag">${files.length} 个文件</span>${s.override?'<span class="tag warn">已启用本地覆盖</span>':''}</div><div class="sep-title">资源文件</div><div class="file-area"><div class="file-tree">${files.map(f=>`<button data-action="file" data-value="${esc(f)}" class="${state.file===f?'active':''}">${f.includes('/')?'↳ ':'◫ '}${esc(f)}</button>`).join('')}</div><div class="file-editor"><div class="file-top"><span>${esc(state.file)}</span><span>${s.origin==='builtin'&&!s.override?'只读原版':'可编辑'}</span></div><textarea spellcheck="false" class="code-area" data-skill-file ${s.origin==='builtin'&&!s.override?'readonly':''}>${esc(s.files[state.file]||'')}</textarea></div></div><div class="title-actions" style="margin-top:10px">${s.origin==='builtin'&&!s.override?'<button class="btn" data-action="override-skill">创建本地可编辑副本</button>':'<button class="btn" data-action="save-skill-file">保存文件内容</button>'}<button class="btn" data-action="open-folder">打开所属文件夹</button></div><div class="panel"><div class="panel-title">成员引用 · ${bs.length}</div>${bs.length?bs.map(b=>`<div class="edit-row"><span class="avatar-dot dot-blue"></span><div class="list-main">${esc(b.team)}<div class="list-sub">${esc(b.member)}</div></div><button class="mini-link" data-action="unbind" data-id="${s.id}" data-team="${b.teamId}" data-member="${b.memberId}">解除绑定</button></div>`).join(''):'<div class="muted">尚未分配给任何成员</div>'}</div><div class="panel"><div class="panel-title">MCP 及运行环境依赖</div><div class="info"><span>ⓘ</span><span>声明依赖 ≠ 自动安装或注册 MCP；是否启用、连接授权、服务器指令或工具权限仍由宿主控制。脚本的 Python / Shell 环境需在执行时验证。</span></div>${s.requiresMcp.length?s.requiresMcp.map(x=>`<div class="edit-row"><span class="avatar-dot dot-amber"></span><div class="list-main">${esc(x.name)}<div class="list-sub">${esc(x.status)} · ${x.optional?'可选':'必需'}</div></div><button class="btn small" data-action="mcp-check">检查连接</button></div>`).join(''):'<div class="muted">此演示 Skill 没有声明 MCP 依赖</div>'}</div>${s.origin==='builtin'?`<div class="panel"><div class="space-between"><div class="panel-title">内置版本升级</div><span class="tag">随插件发布</span></div><p class="muted">内置原版只读；本地修改版本独立保存，升级不覆盖修改，支持比较与回退（本原型模拟状态）。</p><div class="title-actions"><button class="btn" data-action="upgrade">检查更新 / 比较</button><button class="btn" data-action="restore-skill">恢复内置原版</button></div></div>`:`<div class="panel"><div class="panel-title">删除 Skill</div><p class="muted">删除前检查成员绑定、活跃实例及显式依赖。存在阻断依赖时不能删除。</p><button class="btn danger" data-action="delete-skill">删除此自定义 Skill</button></div>`}`}
function chatMarkup(){const matches=filterTeams(state.chatSource,state.chatGroup,state.chatQuery),current=state.selectedSessionTeam==='none'?null:findTeam(state.selectedSessionTeam);return `<section class="chat-shell"><aside class="chat-side"><div class="space-between"><b>DSH</b><button data-action="mode" data-value="settings">⚙</button></div><button>＋ 新建对话</button><div class="divider"></div><span class="label">最近对话</span><button style="background:#edf0f3">插件 v0.1.6 设计讨论</button><button>项目代码检查</button></aside><section class="chat-main"><header class="chat-top"><span>插件 v0.1.6 设计讨论</span><button class="btn small" data-action="mode" data-value="settings">打开设置</button></header><div class="chat-void">今天想完成什么？</div><div class="chat-composer"><textarea placeholder="给 DSH 发送消息…"></textarea><div class="composer-bottom"><div class="composer-tools"><button title="添加文件">＋</button><button title="会话模式">♧ 工作区内修改⌄</button><button class="compose-team" data-action="toggle-chat">${esc(current?.name||'未选择团队')}⌄</button></div><button class="btn primary small" data-action="send-message">发送 ↗</button></div>${state.chatOpen?`<div class="compose-pop"><div class="space-between"><b style="font-size:13px">选择团队</b><button class="mini-link" data-action="toggle-chat">关闭</button></div><input class="search" style="width:100%;margin:9px 0" value="${esc(state.chatQuery)}" data-input="chat-search" placeholder="搜索名称、标签、适用场景…"><div class="segment category-strip" data-category-strip="chat" style="margin:0 0 7px"><button class="${state.chatSource==='all'&&state.chatGroup==='all'?'active':''}" data-action="chat-source-chip" data-value="all">全部</button><button class="${state.chatSource==='builtin'?'active':''}" data-action="chat-source-chip" data-value="builtin">插件内置</button><button class="${state.chatSource==='custom'?'active':''}" data-action="chat-source-chip" data-value="custom">自定义</button>${state.groups.map(g=>`<button class="category-extra ${state.chatGroup===g.id?'active':''}" data-action="chat-category-chip" data-value="${esc(g.id)}">${esc(g.name)}</button>`).join('')}</div><div class="toolbar" style="margin:0 0 8px"><select class="select" style="flex:1;min-width:0" data-change="chat-group"><option value="all">所有分类</option><option value="series:研发规模" ${state.chatGroup==='series:研发规模'?'selected':''}>插件内置 · 研发规模</option><option value="series:工作模式" ${state.chatGroup==='series:工作模式'?'selected':''}>插件内置 · 工作模式</option>${state.groups.map(g=>`<option value="${g.id}" ${state.chatGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select class="select" data-change="chat-source"><option value="all">全部</option><option value="builtin" ${state.chatSource==='builtin'?'selected':''}>内置</option><option value="custom" ${state.chatSource==='custom'?'selected':''}>自定义</option></select></div><button class="compose-option ${!current?'active':''}" data-action="select-session" data-id="none"><b>未选择团队</b><small>恢复普通会话 · 无论筛选条件均可选择</small></button><div class="divider" style="margin:6px 0"></div><div class="compose-list">${matches.map(t=>`<button class="compose-option ${current?.id===t.id?'active':''}" data-action="select-session" data-id="${t.id}"><b>${esc(t.name)}</b><small>${esc(t.metadata?.summary||'')}</small></button>`).join('')||'<p class="muted">没有符合条件的团队</p>'}</div><div class="chat-status">${matches.length} 个匹配结果 · 展示元数据不会自动注入</div></div>`:''}</div></section></section>`}
function renderModal(){const el=document.getElementById('overlay');if(!state.modal){el.innerHTML='';return}let h='';const kind=state.modal;const s=findSkill();if(kind==='manage-groups'){h=`<h2>管理我的分类</h2><p>系统来源「插件内置 / 自定义」及插件内置的两种系列不可修改；用户分类仅组织视图。</p>${state.groups.map(g=>`<div class="edit-row"><input style="flex:1;min-width:0" class="field" data-category-rename="${g.id}" value="${esc(g.name)}"><button class="btn small danger" data-action="remove-category" data-id="${g.id}">删除</button></div>`).join('')}<label class="field-label">新分类名称</label><input class="field" id="new-category" placeholder="例如：嵌入式开发"><div class="dialog-actions"><button class="btn" data-action="modal-close">完成</button><button class="btn primary" data-action="create-category">新建分类</button></div>`}else if(kind==='new-skill'){h=`<h2>新建 Team Skill</h2><p>在插件私有目录创建完整技能文件夹，自动生成 SKILL.md。以下仅修改原型内存。</p><label class="field-label">Skill 名称（目录名）</label><input class="field" id="skill-name" placeholder="example-skill"><label class="field-label">简介</label><input class="field" id="skill-desc" placeholder="这个技能处理什么任务"><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="create-skill">新建</button></div>`}else if(kind==='new-team'){h=`<h2>新建团队</h2><label class="field-label">团队名称</label><input class="field" id="team-name" placeholder="我的新团队"><p>新建团队的展示元数据可以全部留空。</p><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="create-team">创建团队</button></div>`}else if(kind==='restore'){h=`<h2>恢复全部插件内置默认团队？</h2><p>插件内置共 9 个团队（研发规模 3 + 工作模式 6）。将恢复内置内容与展示元数据，保留用户自定义团队、个人分类；同名成员的本地模型路由和工具策略应由正式实现按既有规则处理。</p><div class="callout-amber">原型操作会恢复演示数据。真实插件必须预览影响并在用户确认后保存。</div><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="do-restore">确认恢复</button></div>`}else if(kind==='delete-skill'){const bs=bindings(s.id);h=`<h2>删除 ${esc(s.name)}</h2>${bs.length?`<div class="callout-red"><b>删除已阻断：技能正在被 ${bs.length} 位成员引用。</b><br>${bs.map(b=>esc(b.team+' / '+b.member)).join('<br>')}<br>请先在详情页逐项解除绑定。实际删除时还必须复查活跃实例和其他依赖。</div>`:`<p>成员引用检查：0 项。演示环境中无法确证真实宿主的活跃运行实例，生产实现仍必须二次校验。</p>`}<div class="dialog-actions"><button class="btn" data-action="modal-close">返回</button><button class="btn danger" ${bs.length?'disabled':''} data-action="confirm-delete-skill">确认删除（模拟）</button></div>`}else if(kind==='upgrade'){h=`<h2>内置 Skill 版本维护</h2><p>${esc(s.name)} · 内置原版 ${esc(s.version)}。版本以完整资源目录为单位，更新需有完整性校验、历史快照和用户覆盖保护。</p><div class="panel" style="margin:0"><b>演示：发现插件内置 v1.1.0</b><div class="muted">SKILL.md 更新、references/usage.md 修改；本地覆盖版不会被自动覆盖。</div></div><div class="dialog-actions"><button class="btn" data-action="modal-close">关闭</button><button class="btn primary" data-action="demo-upgrade">模拟采用新版原版</button></div>`}else if(kind==='import-skill'){h=`<h2>导入完整 Team Skill 文件夹</h2><p>选择含 SKILL.md 的根目录。保留 scripts、references、assets 的相对路径；禁止自动执行脚本。</p><input id="skill-folder-input" type="file" multiple webkitdirectory directory style="width:100%;font-size:12px"><p class="muted">离线原型只能检查所选文件结构和显示清单，不能将文件写入插件私有目录；真实安装须通过宿主受控接口。</p><div id="folder-preview" class="muted"></div><div class="dialog-actions"><button class="btn" data-action="modal-close">关闭</button><button class="btn primary" data-action="inspect-folder">校验选中文件夹</button></div>`}else if(kind==='import-preset'){h=`<h2>导入团队预设</h2><p>导入 JSON；展示元数据参与导入，个人 Skill 与绑定关系不在普通共享预设中。</p><input id="preset-input" type="file" accept=".json,application/json"><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="do-import-preset">读取 JSON（模拟导入）</button></div>`}else if(kind==='open-folder'){h=`<h2>打开 Team Skills 文件夹</h2><p>在实际 DSH Desktop 中通过经验证的 Host API 打开插件私有目录；Web 环境需根据公开 API 决定是否支持。</p><div class="info">离线原型不会伪造文件系统权限、启动系统文件管理器或提供虚假的绝对路径。</div><div class="dialog-actions"><button class="btn" data-action="modal-close">关闭</button></div>`}else if(kind==='delete-team'){const t=findTeam(state.modalData);h=`<h2>删除团队预设？</h2><p>${esc(t?.name||'')} 将从本地团队列表中删除。恢复插件内置默认可重新添加内置预设；对当前活跃会话的影响必须由正式宿主机制安全处理。</p><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn danger" data-action="confirm-delete-team">确认删除</button></div>`}else if(kind==='restore-skill'){h=`<h2>恢复内置 Skill 原版？</h2><p>退出本地覆盖模式，并恢复到随插件提供的内置版本。真实实现应保存覆盖备份，并在运行成员使用期间限制切换。</p><div class="dialog-actions"><button class="btn" data-action="modal-close">取消</button><button class="btn primary" data-action="confirm-restore-skill">确认恢复</button></div>`}
el.innerHTML=`<div class="modal-backdrop" data-action="modal-close"><div class="dialog" role="dialog" aria-modal="true" aria-label="操作对话框">${h}</div></div>`;}
function downloadJSON(name,content){const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function saveField(el){const t=findTeam(),m=slot();if(el.dataset.teamField){t[el.dataset.teamField]=el.value;t.modified=t.origin==='builtin';state.dirty=true}else if(el.dataset.metaField){const k=el.dataset.metaField;t.metadata[k]=['tags','useCases','quickPrompts'].includes(k)?el.value.split(k==='tags'?/,/:'\n').map(x=>x.trim()).filter(Boolean):el.value;t.modified=t.origin==='builtin';state.dirty=true}else if(el.dataset.memberField){if(el.dataset.memberField==='tool')m.tool=el.value;else if(el.dataset.memberField==='prompt')m.prompt=el.value;else m[el.dataset.memberField]=el.value;t.modified=t.origin==='builtin';state.dirty=true}else if(el.dataset.skillFile){const s=findSkill();if(s.origin==='custom'||s.override){s.files[state.file]=el.value;state.dirty=true}}}
function handleAction(btn){const a=btn.dataset.action,id=btn.dataset.id,v=btn.dataset.value;switch(a){case 'mode':state.mode=v;state.chatOpen=false;render();return;case 'host-nav':notify('这里仅原型化「智能体团队预设」，其他设置项仍由 DSH 宿主提供。');return;case 'page':setPage(v);return;case 'new-team':case 'restore':case 'manage-groups':case 'new-skill':case 'import-skill':case 'import-preset':case 'open-folder':state.modal=a;renderModal();return;case 'go-skills':state.page='skills';render();return;case 'source':state.source=v;state.groupFilter='all';render();return;case 'category':state.groupFilter=v;state.source='all';render();return;case 'chat-source-chip':state.chatSource=v;state.chatGroup='all';render();return;case 'chat-category-chip':state.chatGroup=v;state.chatSource='all';render();return;case 'skill-source':state.skillSource=v;render();return;case 'open-team':state.activeTeam=id;setPage('team');return;case 'open-member':state.activeMember=id;setPage('member');return;case 'open-skill':state.selectedSkill=id;state.file='SKILL.md';setPage('skill');return;case 'file':state.file=v;render();return;case 'toggle-metadata':state.metadataFold=!state.metadataFold;render();return;case 'add-member':{const t=findTeam();const i=t.members.length+1;t.members.push({id:'new-'+Date.now(),name:'新队员 '+i,description:'',provider:'未指定',model:'按环境选择',effort:'模型默认',tool:'all',prompt:'',skills:[]});state.dirty=true;render();notify('已新增队员，点击进入配置');return}case 'remove-member':{const t=findTeam();t.members=t.members.filter(x=>x.id!==id);state.dirty=true;render();notify('已从当前预设删除队员（演示）');return}case 'color':slot().color=v;state.dirty=true;render();return;case 'duplicate':{const t=findTeam(id),copy=structuredClone(t);copy.id='custom-'+Date.now();copy.name=t.name+'（副本）';copy.origin='custom';copy.modified=false;copy.group='';state.teams.push(copy);render();notify('已创建自定义团队副本');return}case 'export':{const t=findTeam(id),obj={format:'dsh-team-preset-v0.1.6-prototype',name:t.name,purpose:t.purpose,metadata:t.metadata,captain:{name:t.captain.name,description:t.captain.description,prompt:t.captain.prompt},members:t.members.map(m=>({name:m.name,description:m.description,prompt:m.prompt}))};downloadJSON('team-'+t.id+'.json',obj);notify('已导出包含展示元数据的示例 JSON（不含本地 Skills）');return}case 'delete-team':state.modal='delete-team';state.modalData=id;renderModal();return;case 'confirm-delete-team':state.teams=state.teams.filter(x=>x.id!==state.modalData);state.modal='';state.modalData=null;render();notify('已删除该团队演示数据');return;case 'modal-close':state.modal='';renderModal();return;case 'create-category':{const el=document.getElementById('new-category');const text=el.value.trim();if(!text){notify('请输入分类名称');return}state.groups.push({id:'g-'+Date.now(),name:text});state.dirty=true;render();notify('分类已创建');return}case 'remove-category':state.groups=state.groups.filter(g=>g.id!==id);state.teams.forEach(t=>{if(t.group===id)t.group=''});render();notify('分类已删除，团队仍保留');return;case 'create-team':{const value=document.getElementById('team-name').value.trim();if(!value){notify('请输入团队名称');return}const t=makeTeam(['custom-'+Date.now(),value,'自定义','',[],[]]);t.origin='custom';t.members=[];t.purpose='';t.captain.prompt='';state.teams.push(t);state.activeTeam=t.id;state.modal='';state.page='team';state.dirty=true;render();return}case 'create-skill':{const name=document.getElementById('skill-name').value.trim(),desc=document.getElementById('skill-desc').value.trim();if(!/^[a-z0-9][a-z0-9-]{1,63}$/.test(name)){notify('技能名称需用小写英文、数字与短横线，至少两位');return}if(skills.some(s=>s.name===name)){notify('Skill 名称已存在');return}const s={id:'c-'+Date.now(),name,desc,origin:'custom',version:'local',files:{'SKILL.md':`---\nname: ${name}\ndescription: ${desc}\n---\n\n# ${name}\n\n`},requiresMcp:[]};skills.push(s);state.selectedSkill=s.id;state.file='SKILL.md';state.page='skill';state.modal='';render();return}case 'override-skill':findSkill().override=true;render();notify('已建立可编辑本地覆盖（模拟）');return;case 'save-skill-file':{const s=findSkill();const textarea=document.querySelector('[data-skill-file]');if(s.origin==='builtin'&&!s.override){notify('内置原版只读');return}s.files[state.file]=textarea.value;state.dirty=true;render();notify('文件已保存到原型内存');return}case 'delete-skill':state.modal='delete-skill';renderModal();return;case 'confirm-delete-skill':{const s=findSkill();if(bindings(s.id).length){notify('仍有绑定，拒绝删除');return}if(s.origin==='builtin'){notify('不能删除随包提供的内置原版');return}skills.splice(skills.findIndex(x=>x.id===s.id),1);state.modal='';state.page='skills';render();notify('已删除自定义 Skill（模拟）');return}case 'unbind':{const t=findTeam(btn.dataset.team);const m=btn.dataset.member==='captain'?t.captain:t.members.find(x=>x.id===btn.dataset.member);m.skills=m.skills.filter(x=>x!==id);state.dirty=true;render();notify('已解除成员引用');return}case 'upgrade':state.modal='upgrade';renderModal();return;case 'demo-upgrade':findSkill().version='1.1.0';state.modal='';render();notify('仅模拟内置版本号变更，非真正安装更新');return;case 'restore-skill':state.modal='restore-skill';renderModal();return;case 'confirm-restore-skill':findSkill().override=false;state.modal='';render();notify('已切回插件内置只读原版（模拟）');return;case 'mcp-check':notify('连接检查需宿主 MCP 公开服务，此原型不伪造结果。');return;case 'inspect-folder':{const input=document.getElementById('skill-folder-input'),files=[...input.files];if(!files.length){notify('请先选择文件夹');return}const paths=files.map(f=>f.webkitRelativePath||f.name);const root=paths[0].split('/')[0];const hasSkill=paths.some(p=>p===root+'/SKILL.md');document.getElementById('folder-preview').textContent=`${files.length} 个文件；${hasSkill?'找到根目录 SKILL.md，结构初检通过':'缺少根目录 SKILL.md，拒绝安装'}。仅展示前 6 个：${paths.slice(0,6).join(' · ')}`;return}case 'do-import-preset':{const input=document.getElementById('preset-input');if(!input.files?.length){notify('请先选择 JSON');return}input.files[0].text().then(str=>{try{const j=JSON.parse(str);if(!j.name||typeof j.name!=='string')throw Error('缺少团队名称');const t=makeTeam(['custom-'+Date.now(),j.name,'自定义','',[],[]]);t.origin='custom';t.purpose=j.purpose||'';t.metadata={summary:j.metadata?.summary||'',tags:Array.isArray(j.metadata?.tags)?j.metadata.tags:[],useCases:Array.isArray(j.metadata?.useCases)?j.metadata.useCases:[],quickPrompts:Array.isArray(j.metadata?.quickPrompts)?j.metadata.quickPrompts:[],notes:j.metadata?.notes||''};t.members=[];state.teams.push(t);state.modal='';render();notify('已导入团队展示数据（原型，需正式版验证格式）')}catch(e){notify('JSON 不符合演示导入格式：'+e.message)}});return}case 'do-restore':{const custom=state.teams.filter(x=>x.origin==='custom');state.teams=origTeams.map(makeTeam).concat(custom);state.teams.find(x=>x.id==='engineering').members.push({id:'repository-specialist',name:'repository-specialist',description:'负责 GitHub 仓库展示与版本交付',provider:'未指定',model:'跟随配置',effort:'模型默认',tool:'all',prompt:'负责仓库配置、Release 和发布规范。',skills:['repo-presentation','git-release']});state.modal='';render();notify('已恢复 9 个插件内置预设（模拟）');return}case 'config':notify('「打开配置文件」为宿主原生操作，静态原型不模拟文件系统写入。');return;case 'save':state.dirty=false;notify('演示数据已提交到页面状态，不会写入真实 DSH');render();return;case 'discard':notify('离线原型不会持久保存；刷新页面可重置全部演示状态。');return;case 'toggle-chat':state.chatOpen=!state.chatOpen;render();return;case 'select-session':state.selectedSessionTeam=id;state.chatOpen=false;render();notify(id==='none'?'已切换到「未选择团队」（演示）':'已选择团队（演示）：'+findTeam(id)?.name);return;case 'send-message':notify('这是团队选择器原型，不能向 DSH 发送消息。');return;default:return}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){if(e.target.closest('.dialog')===null&&btn.classList.contains('modal-backdrop')){state.modal='';renderModal();return}handleAction(btn)}});
document.addEventListener('change',e=>{const x=e.target,k=x.dataset.change;if(k==='team-group'){state.groupFilter=x.value;state.source='all';render()}else if(k==='chat-group'){state.chatGroup=x.value;render()}else if(k==='chat-source'){state.chatSource=x.value;render()}else if(k==='assign-category'){findTeam().group=x.value;state.dirty=true;render()}else if(x.dataset.categoryRename){const g=state.groups.find(g=>g.id===x.dataset.categoryRename);if(g){g.name=x.value.trim()||g.name;state.dirty=true;render()}}else if(x.dataset.skillToggle){const s=slot(),id=x.dataset.skillToggle;s.skills=x.checked?[...new Set([...s.skills,id])]:s.skills.filter(v=>v!==id);state.dirty=true;render();notify('已更新此成员的 Team Skill 分配（演示）')}else if(x.dataset.memberField||x.dataset.teamField||x.dataset.metaField)saveField(x)});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.input;if(k){const pos=el.selectionStart;if(k==='team-search')state.query=el.value;if(k==='skill-search')state.skillQuery=el.value;if(k==='chat-search')state.chatQuery=el.value;render();const replacement=document.querySelector(`[data-input="${k}"]`);if(replacement){replacement.focus();replacement.setSelectionRange(pos,pos)}return}if(el.dataset.teamField||el.dataset.metaField||el.dataset.memberField||el.dataset.skillFile){saveField(el)}});
